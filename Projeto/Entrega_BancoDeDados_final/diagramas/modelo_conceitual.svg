<text x="750" y="640" text-anchor="middle" font-family="Arial" font-size="19" fill="#34495e">Um cliente pode possuir vários horários; cada horário pertence a um cliente.</text><text x="750" y="674" text-anchor="middle" font-family="Arial" font-size="19" fill="#34495e">Um serviço pode aparecer em vários horários; cada horário reserva um serviço.</text>
