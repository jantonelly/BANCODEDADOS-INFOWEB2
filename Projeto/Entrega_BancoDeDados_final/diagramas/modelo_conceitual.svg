<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780">
<rect width="1500" height="780" fill="#f8fafc"/><text x="750" y="55" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#132238">Modelo Conceitual — Sistema de Agendamento</text>
<style>.entity{fill:#fff;stroke:#205493;stroke-width:3}.head{fill:#205493}.htext{font:bold 23px Arial;fill:#fff}.attr{font:19px Arial;fill:#132238}.diamond{fill:#fff4d6;stroke:#ad6a00;stroke-width:3}.rel{font:bold 18px Arial;fill:#132238}.line{stroke:#34495e;stroke-width:3;fill:none}.card{font:bold 18px Arial;fill:#34495e}</style>
<!-- CLIENTE --> <rect class="entity" x="55" y="235" width="300" height="315" rx="8"/><path class="head" d="M63 235h284a8 8 0 0 1 8 8v48H55v-48a8 8 0 0 1 8-8z"/><text class="htext" x="205" y="272" text-anchor="middle">CLIENTE</text><text class="attr" x="80" y="335">id_cliente (identificador)</text><text class="attr" x="80" y="378">nome</text><text class="attr" x="80" y="421">email</text><text class="attr" x="80" y="464">telefone</text>
<!-- HORARIO --> <rect class="entity" x="600" y="235" width="300" height="315" rx="8"/><path class="head" d="M608 235h284a8 8 0 0 1 8 8v48H600v-48a8 8 0 0 1 8-8z"/><text class="htext" x="750" y="272" text-anchor="middle">HORÁRIO</text><text class="attr" x="625" y="335">id_horario (identificador)</text><text class="attr" x="625" y="378">data_hora</text><text class="attr" x="625" y="421">confirmado</text>
<!-- SERVICO --> <rect class="entity" x="1145" y="235" width="300" height="315" rx="8"/><path class="head" d="M1153 235h284a8 8 0 0 1 8 8v48h-300v-48a8 8 0 0 1 8-8z"/><text class="htext" x="1295" y="272" text-anchor="middle">SERVIÇO</text><text class="attr" x="1170" y="335">id_servico (identificador)</text><text class="attr" x="1170" y="378">descricao</text><text class="attr" x="1170" y="421">valor</text>
