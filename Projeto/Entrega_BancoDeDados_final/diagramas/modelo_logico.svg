<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860">
<rect width="1500" height="860" fill="#f8fafc"/><text x="750" y="55" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#132238">Modelo Lógico Relacional — Agenda de Serviços</text>
<style>.box{fill:#fff;stroke:#205493;stroke-width:3}.head{fill:#205493}.htext{font:bold 23px Arial;fill:#fff}.col{font:19px 'Courier New',monospace;fill:#132238}.line{stroke:#34495e;stroke-width:3;fill:none}.card{font:bold 17px Arial;fill:#34495e}</style>
<rect class="box" x="70" y="190" width="390" height="305" rx="8"/><path class="head" d="M78 190h374a8 8 0 0 1 8 8v50H70v-50a8 8 0 0 1 8-8z"/><text class="htext" x="265" y="225" text-anchor="middle">Cliente</text><text class="col" x="98" y="292">PK  id_cliente     INT</text><text class="col" x="98" y="335">     nome           NVARCHAR(120)</text><text class="col" x="98" y="378">UQ  email          NVARCHAR(254)</text><text class="col" x="98" y="421">     telefone       NVARCHAR(30)</text>
<rect class="box" x="555" y="190" width="390" height="350" rx="8"/><path class="head" d="M563 190h374a8 8 0 0 1 8 8v50H555v-50a8 8 0 0 1 8-8z"/><text class="htext" x="750" y="225" text-anchor="middle">Horario</text><text class="col" x="583" y="292">PK  id_horario     INT</text><text class="col" x="583" y="335">     data_hora      DATETIME2</text><text class="col" x="583" y="378">     confirmado     BIT</text><text class="col" x="583" y="421">FK  id_cliente     INT</text><text class="col" x="583" y="464">FK  id_servico     INT</text>
<rect class="box" x="1040" y="190" width="390" height="305" rx="8"/><path class="head" d="M1048 190h374a8 8 0 0 1 8 8v50h-390v-50a8 8 0 0 1 8-8z"/><text class="htext" x="1235" y="225" text-anchor="middle">Servico</text><text class="col" x="1068" y="292">PK  id_servico     INT</text><text class="col" x="1068" y="335">     descricao      NVARCHAR(160)</text><text class="col" x="1068" y="378">     valor          DECIMAL(10,2)</text>
<path class="line" d="M460 420H555M945 465H1040"/><text class="card" x="475" y="405">1</text><text class="card" x="530" y="405">N</text><text class="card" x="960" y="450">N</text><text class="card" x="1015" y="450">1</text>
<text x="750" y="650" text-anchor="middle" font-family="Arial" font-size="19" fill="#34495e">PK chave primária • FK chave estrangeira • UQ valor único</text><text x="750" y="690" text-anchor="middle" font-family="Arial" font-size="18" fill="#34495e">As chaves estrangeiras obrigatórias em Horario implementam as relações 1:N.</text>
